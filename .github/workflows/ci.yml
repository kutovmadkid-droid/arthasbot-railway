name: Bot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check --config pyproject.toml shop tests
      - run: python -m pip check
      - run: docker build -t aurora-shop:test .
      - name: Check imports, cover and database inside the image
        run: >-
          docker run --rm --entrypoint python aurora-shop:test -c
          "import tempfile; from pathlib import Path; from shop.app import Shop; from shop.__main__ import main; from shop.store import Store; assert Path('/app/assets/cover.jpg').read_bytes()[:2] == bytes([255,216]); tmp=tempfile.TemporaryDirectory(); store=Store(str(Path(tmp.name)/'smoke.sqlite3')); assert store.db.execute('PRAGMA user_version').fetchone()[0] == 2; store.close(); tmp.cleanup(); print('Docker imports, cover and database initialization passed')"
